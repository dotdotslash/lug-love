services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: luglove
      POSTGRES_USER: luglove
      POSTGRES_PASSWORD: luglove_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luglove"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
